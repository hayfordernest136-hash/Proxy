services:
  # Frontend - TanStack Start SSR Web Service
  - type: web
    name: proxyflex-frontend
    env: node
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE
        value: https://proxyflex.onrender.com
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false

  # Backend API Web Service
  - type: web
    name: proxyflex
    env: node
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://proxyflex-frontend.onrender.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
